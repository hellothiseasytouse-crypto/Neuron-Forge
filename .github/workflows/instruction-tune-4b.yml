name: Instruction tune Neuron Forge 4B
on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Optional short infrastructure test; leave empty for configured SFT"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: neuron-forge-4b-instruction-tuning
  cancel-in-progress: false
jobs:
  tune:
    name: 4B supervised instruction tuning (self-hosted GPU runner)
    runs-on: [self-hosted, linux, x64, gpu, multi-gpu]
    timeout-minutes: 4320
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Verify hardware
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          count=torch.cuda.device_count()
          print("PyTorch",torch.__version__,"CUDA",torch.version.cuda,"GPUs",count)
          if count<8 or not torch.cuda.is_available() or not torch.cuda.is_bf16_supported():
              raise SystemExit("SFT requires at least 8 BF16-capable CUDA GPUs.")
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[training]"
      - name: Verify pretrained checkpoint and reviewed SFT data
        run: |
          test -f checkpoints/neuron-forge-4b/latest.json
          test -f data/4b-sft/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/4b-sft/manifest.json").read_text())
          assert m["format"]=="neuronforge-sft-v1" and m["assistant_only_loss"]
          assert m["train_examples"]>0 and m["validation_examples"]>0
          print(m)
          PY
      - name: Instruction tune
        env:
          MAX_STEPS: \${{ inputs.max_steps }}
        run: |
          set -o pipefail
          N=$(python -c "import torch; print(torch.cuda.device_count())")
          ARGS=(--config configs/4b-sft.yaml --data-dir data/4b-sft --pretrained-checkpoint checkpoints/neuron-forge-4b --checkpoint-dir checkpoints/neuron-forge-4b-sft)
          if [ -n "$MAX_STEPS" ]; then ARGS+=(--max-steps "$MAX_STEPS"); fi
          mkdir -p checkpoints/neuron-forge-4b-sft
          torchrun --standalone --nnodes=1 --nproc_per_node="$N" scripts/instruction_tune_4b_fsdp.py "\${ARGS[@]}" 2>&1 | tee checkpoints/neuron-forge-4b-sft/training.log
      - name: Report
        if: always()
        run: |
          if [ -f checkpoints/neuron-forge-4b-sft/latest.json ]; then cat checkpoints/neuron-forge-4b-sft/latest.json; else echo "No SFT checkpoint; inspect training.log."; fi
