# Neuron Forge 4B-class model: 4,064,498,688 trainable parameters.
# Decoder-only Transformer initialized randomly; no pretrained weights.
model:
  vocab_size: 32768
  block_size: 2048
  n_layer: 35
  n_head: 24
  n_embd: 3072
  dropout: 0.0
tokenizer:
  vocab_size: 32768
  min_frequency: 2
  max_train_chars: 1000000000
train:
  data_path: data/4b/general_corpus.txt
  batch_size: 1
  max_steps: 200000
  target_tokens: 100000000000
  minimum_data_tokens: 20000000000
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  warmup_steps: 2000
  eval_interval: 500
  eval_batches: 4
  weight_decay: 0.1
  grad_clip: 1.0
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  checkpoint_path: checkpoints/neuron-forge-4b/latest
  seed: 20261113
  device: cuda
