# A modest training configuration. Increase model size only when your hardware allows it.
model:
  block_size: 256
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1
tokenizer:
  vocab_size: 512
  min_frequency: 2
  max_train_chars: 2000000
train:
  data_path: data/processed/shakespeare_corpus.txt
  batch_size: 16
  max_steps: 5000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 100
  eval_interval: 250
  eval_batches: 20
  weight_decay: 0.1
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  checkpoint_path: checkpoints/latest.pt
  seed: 1337
  device: auto
